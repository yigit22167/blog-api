services:
  postgres:
    image: postgres:17-alpine
    container_name: blog-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - blog_data:/var/lib/postgresql/data

volumes:
  blog_data: